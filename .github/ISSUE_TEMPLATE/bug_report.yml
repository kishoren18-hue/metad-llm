name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or code you ran and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      description: The smallest input that shows the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: "e.g. 0.2.0, Python 3.12, macOS 15"
